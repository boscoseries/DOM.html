<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> The Zoo</title>
    <style>
   body{
    font-family: Arial, sans-serif;
    background-color: lightblue;
    text-align: center;
    padding: 30px;
   }

   h1{
    color: brown;
   }

   #zoo{
    border: 1px solid black;
    width: 300px;
    margin: 16px auto;
    padding: 30px;
    border-radius: 10px;
    background: white;
   }

   .zone{
    border: 1px solid black ;
    margin: 6px 0;
    padding: 8px 13px ;
    border-radius: 8px;
   }

   button{
    background-color: black;
    border: solid 1px ;
    border-radius: 15px;
    padding: 13px;
    color: white;
   }
    </style>
</head>
<body>
    <h1> JAVASCRIPT DOM</h1>
    <p> Use javascript and the DOM to add anmals to each cage</p>

    <div id ="zoo"> 
    <div class="zone"> Zone 1: <span id="zone1"></span></div>
    <div class="zone"> Zone 2: <span id="zone2"></span></div>
    <div class="zone"> Zone 3: <span id="zone3"></span></div>
    <div class="zone"> Total Animals: <span id="total"> </span></div>
    </div>

    <br>
    <button onclick="openZoo()"> Open the Zoo</button>

    <p id="zoo-status"> </p>

    <script>
        function openZoo(){
       document.getElementById("zone1") .innerHTML = "Tiger"

       document.getElementById("zone2") .innerHTML = "Chimpanzee"

       document.getElementById("zone3") .innerHTML = "Crocodile"

       document.getElementById("total") .innerHTML = "3"

       document.getElementById("zoo").style.backgroundColor = "lightgreen"

       document.getElementById("zoo-status") .innerHTML = document.title + " is now open"
        }
    </script>
</body>
</html>
